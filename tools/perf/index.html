<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoVox Perf Lab</title>
<style>
:root {
    --background: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0a66c2;
    --rule: #d2d2d7;
}
@media (prefers-color-scheme: dark) {
    :root {
        --background: #111113;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #4ea1ff;
        --rule: #3a3a3c;
    }
}
body {
    background: var(--background);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0 16px 32px;
}
h1 {
    font-size: 20px;
    margin: 16px 0 4px;
}
#status {
    color: var(--muted);
    margin-bottom: 12px;
}
button {
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    color: #ffffff;
    font-size: 15px;
    margin: 0 8px 8px 0;
    padding: 8px 14px;
}
#log {
    border-top: 1px solid var(--rule);
    font: 12px/1.35 ui-monospace, Menlo, monospace;
    margin: 0;
    overflow-wrap: anywhere;
    padding-top: 8px;
    white-space: pre-wrap;
}
</style>
</head>
<body>
<h1>PicoVox Perf Lab</h1>
<div id="status">Starting...</div>
<div>
    <button id="timing" type="button">Run a timing here</button>
    <button id="reload" type="button">Reload</button>
    <button id="toneDirect" type="button">Tone: Web Audio</button>
    <button id="toneMedia" type="button">Tone: media element</button>
</div>
<pre id="log"></pre>
<script type="module" src="lab.js"></script>
</body>
</html>
